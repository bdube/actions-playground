name: Validate PR Title Format

on:
  pull_request:
    branches: [main, release/*]
    types: [opened, edited, synchronize, reopened]
  workflow_call:

permissions:
  # To comment on pull requests.
  pull-requests: write

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: deepakputhraya/action-pr-title@3864bebc79c5f829d25dd42d3c6579d040b0ef16 # v1.0.2
        with:
          regex: 'IMX-\d+'
          prefix_case_sensitive: false
          min_length: 5
          max_length: 1000

      - name: Comment on PR if title check fails
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh pr comment
          ${{ github.event.pull_request.number }}
          --body "The PR title does not meet the required format. Please ensure it matches the pattern \`IMX-\\d+\` (e.g., \`IMX-1234 Add new feature\`)."
