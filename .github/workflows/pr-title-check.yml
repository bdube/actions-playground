name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title format
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          regex: 'IMX-\d+'
          prefix_case_sensitive: false
          min_length: 5
          max_length: 1000
